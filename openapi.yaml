openapi: 3.0.0
info:
  title: LuvBlue Backend API
  description: API documentation for the LuvBlue backend project, including authentication and Instagram uploads.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        auth_provider:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InstagramUpload:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string
          description: Comma-separated list of image URLs
        instagram_users:
          type: string
          nullable: true
        instagram_links:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DiaryContent:
      type: object
      properties:
        id:
          type: integer
        diary_image_url:
          type: string
        diary_title:
          type: string
        diary_brief_title:
          type: string
        diary_brief_description:
          type: string
        diary_instagram_link:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BlueNote:
      type: object
      properties:
        id:
          type: integer
        note_image_url:
          type: string
        note_title:
          type: string
        note_brief_title:
          type: string
        note_brief_description:
          type: string
        note_instagram_link:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  version:
                    type: string
                  timestamp:
                    type: string
                  env:
                    type: string

  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user and get token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
 
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /instagram:
    get:
      tags:
        - Instagram
      summary: Get all Instagram uploads
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of Instagram uploads
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstagramUpload'
                      meta:
                        type: object
                        properties:
                          total:
                            type: integer
                          page:
                            type: integer
                          limit:
                            type: integer
                          totalPages:
                            type: integer

    post:
      tags:
        - Instagram
      summary: Upload new Instagram image(s)
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                instagram_image:
                  type: string
                  format: binary
                instagram_users:
                  type: string
                instagram_links:
                  type: string
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/InstagramUpload'
 
  /instagram/stats:
    get:
      tags:
        - Instagram
      summary: Get Instagram upload statistics
      responses:
        '200':
          description: Statistics fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      totalPhotosShared:
                        type: integer
                      heartPixels:
                        type: integer
                      heartFilled:
                        type: number
 
  /instagram/{id}:
    put:
      tags:
        - Instagram
      summary: Update Instagram upload
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                instagram_image:
                  type: string
                  format: binary
                instagram_users:
                  type: string
                instagram_links:
                  type: string
      responses:
        '200':
          description: Update successful
        '404':
          description: Upload not found

    delete:
      tags:
        - Instagram
      summary: Delete Instagram upload
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delete successful
        '403':
          description: Forbidden - Requires admin role

  /diary:
    get:
      tags:
        - Diary
      summary: Get all diary contents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of diary contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiaryContent'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer

    post:
      tags:
        - Diary
      summary: Create new diary content
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                diary_image:
                  type: string
                  format: binary
                diary_title:
                  type: string
                diary_brief_title:
                  type: string
                diary_brief_description:
                  type: string
                diary_instagram_link:
                  type: string
      responses:
        '201':
          description: Created successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/DiaryContent'

  /diary/{id}:
    get:
      tags:
        - Diary
      summary: Get diary content by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Diary content details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DiaryContent'
        '404':
          description: Diary content not found

    put:
      tags:
        - Diary
      summary: Update diary content
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                diary_image:
                  type: string
                  format: binary
                diary_title:
                  type: string
                diary_brief_title:
                  type: string
                diary_brief_description:
                  type: string
                diary_instagram_link:
                  type: string
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/DiaryContent'
        '404':
          description: Diary content not found

    delete:
      tags:
        - Diary
      summary: Delete diary content
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delete successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Diary content not found

  /blue-notes:
    get:
      tags:
        - BlueNote
      summary: Get all blue notes
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of blue notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlueNote'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer

    post:
      tags:
        - BlueNote
      summary: Create new blue note
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                note_image:
                  type: string
                  format: binary
                note_title:
                  type: string
                note_brief_title:
                  type: string
                note_brief_description:
                  type: string
                note_instagram_link:
                  type: string
      responses:
        '201':
          description: Created successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/BlueNote'

  /blue-notes/{id}:
    get:
      tags:
        - BlueNote
      summary: Get blue note by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Blue note details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BlueNote'
        '404':
          description: Blue note not found

    put:
      tags:
        - BlueNote
      summary: Update blue note
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                note_image:
                  type: string
                  format: binary
                note_title:
                  type: string
                note_brief_title:
                  type: string
                note_brief_description:
                  type: string
                note_instagram_link:
                  type: string
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/BlueNote'
        '404':
          description: Blue note not found

    delete:
      tags:
        - BlueNote
      summary: Delete blue note
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delete successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Blue note not found
